name: CI

on:
  # Every branch, not just main: the value of this pipeline is that a T-SQL
  # mistake is caught on the branch that introduced it, against a real engine,
  # before anyone merges or runs the app by hand.
  push:
    branches: ["**"]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # A real SQL Server, not a stand-in. The migrations, the stored procedures and the
    # seed are exercised against the engine they were written for, so a T-SQL mistake
    # fails here rather than in front of whoever runs the app next.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Str0ng!Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Start the API against SQL Server
        env:
          ConnectionStrings__LibraryDb: "Server=localhost,1433;Database=LibrarySystem;User Id=sa;Password=Str0ng!Passw0rd;TrustServerCertificate=True;Encrypt=False"
          ASPNETCORE_URLS: "http://localhost:5080"
        run: |
          dotnet run --project src/Library.Api --no-build -c Release > api.log 2>&1 &
          echo $! > api.pid

      # Hitting the live endpoints proves the procedures were created and actually
      # run, which a unit test with substituted ports cannot tell us. The same script
      # runs locally against docker compose, so CI and a developer check the same
      # things in the same order.
      - name: Smoke-test the running system
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -ApiUrl http://localhost:5080

      - name: API log
        if: failure()
        run: cat api.log || true

      - name: Stop the API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
